<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Véhicule - Gestion des Missions</title>

    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>


    <style th:replace="~{layout/main :: styles}"></style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Lexend', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', "Noto Sans", 'sans-serif', "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- En-tête -->
    <div th:replace="~{layout/main :: header}"></div>
    <!-- Notification -->
    <div th:replace="~{layout/main :: notification}"></div>

    <!-- Contenu principal -->
    <main class="flex-grow container mx-auto px-4 py-6">

        <!-- Titre de la page -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                <i class="fas fa-car mr-2"></i>
                <span>Formulaire Véhicule</span>
            </h1>
            <p class="text-gray-600">Détails des informations du véhicule ci-dessous.</p>
        </div>

        <!-- Formulaire -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6">

                <!-- Informations d'identification -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <p class="block text-sm font-medium text-gray-700 mb-1">
                            Immatriculation
                        </p>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                                <i class="fas fa-tag text-gray-400"></i>
                            </span>
                            <p class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-50"
                                th:text="${vehicule.immatriculation}">
                                AA-123-BB
                            </p>
                        </div>
                    </div>

                    <div>
                        <p class="block text-sm font-medium text-gray-700 mb-1">
                            Type de véhicule
                        </p>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center">
                                <i class="fas fa-truck text-gray-400"></i>
                            </span>
                            <p class="w-full pl-10 pr-3 py-2 rounded-lg bg-gray-50" th:text="${vehicule.type}">
                                BERLINE
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Informations du véhicule -->
                <div class="mb-6">
                    <h2 class="text-lg font-medium text-gray-800 mb-3">Caractéristiques du véhicule</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <p class="block text-sm font-medium text-gray-700 mb-1">
                                Marque
                            </p>
                            <div class="relative">
                                <p class="w-full px-3 py-2 rounded-lg bg-gray-50" th:text="${vehicule.marque}">
                                    Renault
                                </p>
                            </div>
                        </div>

                        <div>
                            <p class="block text-sm font-medium text-gray-700 mb-1">
                                Modèle
                            </p>
                            <div class="relative">
                                <p class="w-full px-3 py-2 rounded-lg bg-gray-50" th:text="${vehicule.modele}">
                                    Clio
                                </p>
                            </div>
                        </div>

                        <div>
                            <p class="block text-sm font-medium text-gray-700 mb-1">
                                Année
                            </p>
                            <div class="relative">
                                <p class="w-full px-3 py-2 rounded-lg bg-gray-50" th:text="${vehicule.annee}">
                                    2022
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Boutons d'action -->
                <div class="flex justify-between">
                    <a th:href="@{/web/vehicules}" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors">
                        <i class="fas fa-arrow-left mr-2"></i> Retour à la liste
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <p class="text-sm">&copy; 2025 Gestion des Missions. Tous droits réservés.</p>
                </div>
            </div>
        </div>
    </footer>
    <script th:replace="~{layout/main :: scripts}"></script>
</body>

</html>
