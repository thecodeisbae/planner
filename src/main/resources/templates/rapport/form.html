<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génération de Rapport - Gestion des Missions</title>

    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js"></script>
    
    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
    <style th:replace="~{layout/main :: styles}"></style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Lexend', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', "Helvetica Neue", 'Arial', "Noto Sans", 'sans-serif', "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    
    <!-- En-tête -->
    <div th:replace="~{layout/main :: header}"></div>
    
    <!-- Notification -->
    <div th:replace="~{layout/main :: notification}"></div>
    
    <!-- Contenu principal -->
    <main class="flex-grow container mx-auto px-4 py-6">
        
        <!-- Titre de la page -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                <i class="fas fa-file-alt mr-2"></i> Génération de Rapport
            </h1>
            <p class="text-gray-600">Générez un rapport des conducteurs en mission pour une période spécifique.</p>
        </div>
        
        <!-- Formulaire de rapport -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-6">
                <form th:action="@{/web/rapport/generer}" method="post" x-data="{ statut: 'EN_COURS' }">
                    <!-- Type de rapport -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Statut de la mission</label>
                        <div class="flex flex-wrap gap-4">
                            <div class="flex items-center">
                                <input type="radio" id="rapport-encours" name="statut" value="EN_COURS" checked
                                       x-model="statut"
                                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="rapport-encours" class="ml-2 block text-sm text-gray-700">
                                    Missions en cours
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="rapport-planifies" name="statut" value="PLANIFIEE"
                                       x-model="statut"
                                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="rapport-planifies" class="ml-2 block text-sm text-gray-700">
                                    Missions planifiées
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="rapport-annulees" name="statut" value="ANNULEE"
                                       x-model="statut"
                                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="rapport-annulees" class="ml-2 block text-sm text-gray-700">
                                    Missions annulées
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="rapport-missions" name="statut" value="TOUS"
                                       x-model="statut"
                                       class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="rapport-missions" class="ml-2 block text-sm text-gray-700">
                                    Toutes les missions
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Période du rapport -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Période du rapport</label>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="debut" class="block text-sm text-gray-500 mb-1">Date de début</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="far fa-calendar-alt text-gray-400"></i>
                                    </div>
                                    <input type="text" id="debut" name="debut" th:value="${debut}" required
                                           class="flatpickr w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
                                           placeholder="Sélectionner une date et heure">
                                </div>
                            </div>
                            <div>
                                <label for="fin" class="block text-sm text-gray-500 mb-1">Date de fin</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="far fa-calendar-alt text-gray-400"></i>
                                    </div>
                                    <input type="text" id="fin" name="fin" th:value="${fin}" required
                                           class="flatpickr w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
                                           placeholder="Sélectionner une date et heure">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Format d'exportation -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Format du rapport</label>
                        <div class="flex flex-wrap gap-4">
                            <div class="flex items-center">
                                <input type="radio" id="format-web" name="format" value="web" checked class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="format-web" class="ml-2 block text-sm text-gray-700">
                                    Page web
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="format-pdf" name="format" value="pdf" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="format-pdf" class="ml-2 block text-sm text-gray-700">
                                    PDF
                                </label>
                            </div>
                            <div class="flex items-center">
                                <input type="radio" id="format-excel" name="format" value="excel" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300">
                                <label for="format-excel" class="ml-2 block text-sm text-gray-700">
                                    Excel
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Boutons d'action -->
                    <div class="flex justify-end space-x-4">
                        <a th:href="@{/web/dashboard}" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition-colors">
                            Annuler
                        </a>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="fas fa-file-export mr-2"></i> Générer le rapport
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
    </main>
    
    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6">
        <div class="container mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <p class="text-sm">&copy; 2025 Gestion des Missions. Tous droits réservés.</p>
                </div>
            </div>
        </div>
    </footer>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialisation de flatpickr pour les sélecteurs de date
            flatpickr(".flatpickr", {
                enableTime: true,
                dateFormat: "Y-m-d H:i",
                time_24hr: true
            });
        });
    </script>
</body>
</html>
